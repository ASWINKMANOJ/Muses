<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muses — Multimodal RAG</title>
  <meta name="description" content="Chat with your documents using Muses — a multimodal RAG system powered by local LLM." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ── Ambient background ─────────────────────────────────────── -->
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- ── App shell ──────────────────────────────────────────────── -->
  <div class="app-shell" id="app">

    <!-- ── Sidebar ────────────────────────────────────────────── -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">✦</span>
          <span class="logo-text">Muses</span>
        </div>
        <p class="logo-sub">Multimodal RAG</p>
      </div>

      <!-- Upload drop zone -->
      <div class="upload-section">
        <div class="drop-zone" id="dropZone" role="button" tabindex="0"
             aria-label="Upload documents">
          <div class="drop-zone-inner">
            <div class="drop-icon" id="dropIcon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
              </svg>
            </div>
            <p class="drop-label">Drop files here</p>
            <p class="drop-sub">PDF · DOCX · TXT · PNG · JPG</p>
          </div>
          <input type="file" id="fileInput" multiple
                 accept=".pdf,.docx,.txt,.png,.jpg,.jpeg"
                 style="display:none" />
        </div>
        <button class="btn-upload" id="btnUpload">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          Choose Files
        </button>
      </div>

      <!-- Upload progress list -->
      <div class="upload-progress-list" id="uploadProgressList"></div>

      <!-- Documents list -->
      <div class="docs-section">
        <div class="docs-header">
          <span class="docs-title">Ingested Documents</span>
          <div style="display:flex;align-items:center;gap:6px">
            <span class="docs-selected-badge" id="docsSelectedBadge" style="display:none"></span>
            <button class="btn-refresh" id="btnRefresh" title="Refresh">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2.5">
                <polyline points="23 4 23 10 17 10"/>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="docs-list" id="docsList">
          <p class="docs-empty" id="docsEmpty">No documents yet.</p>
        </div>
      </div>
    </aside>

    <!-- ── Main chat area ──────────────────────────────────────── -->
    <main class="chat-area" id="chatArea">

      <!-- Empty state -->
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">✦</div>
        <h1 class="empty-title">Ask anything about your documents</h1>
        <p class="empty-sub">Upload a document on the left, then start chatting.</p>
        <div class="empty-chips">
          <button class="chip" id="chip1">Summarise this document</button>
          <button class="chip" id="chip2">What are the key findings?</button>
          <button class="chip" id="chip3">List the main topics covered</button>
        </div>
      </div>

      <!-- Messages -->
      <div class="messages" id="messages" role="log" aria-live="polite"></div>

      <!-- Input bar -->
      <div class="input-bar">
        <!-- Filter pill: shows which documents are being searched -->
        <div class="filter-bar">
          <div class="doc-filter-pill all" id="filterPill">
            <span class="pill-dot"></span>
            <span class="pill-text" id="filterPillText">All Documents</span>
          </div>
        </div>
        <div class="input-wrap">
          <textarea
            id="queryInput"
            class="query-input"
            placeholder="Ask a question about your documents…"
            rows="1"
            aria-label="Chat input"
          ></textarea>
          <button class="btn-send" id="btnSend" aria-label="Send message" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
        <p class="input-hint">Powered by local Ollama · gemma3:4b</p>
      </div>
    </main>
  </div>

  <!-- ── Toast container ────────────────────────────────────────── -->
  <div class="toast-container" id="toastContainer" aria-live="assertive"></div>

  <script src="app.js"></script>
</body>
</html>
